<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Figma → Caveduck Migrator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #1e1e2e;
    color: #e0e0e0;
    min-height: 100vh;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 24px;
    color: #ffd700;
  }
  .subtitle {
    margin: 0 0 20px;
    font-size: 13px;
    color: #888;
  }
  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    height: calc(100vh - 100px);
  }
  .panel {
    display: flex;
    flex-direction: column;
    background: #2a2a3e;
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-header {
    padding: 10px 14px;
    background: #35354d;
    font-size: 13px;
    font-weight: 600;
    color: #ffd700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea {
    flex: 1;
    padding: 12px;
    background: #1a1a2a;
    color: #d0d0d0;
    border: none;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    resize: none;
    outline: none;
    line-height: 1.5;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  button {
    padding: 8px 16px;
    background: #ffd700;
    color: #1e1e2e;
    border: none;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { background: #ffed4e; }
  button.secondary {
    background: #4a4a6a;
    color: #e0e0e0;
  }
  button.secondary:hover { background: #5a5a7a; }
  .status {
    padding: 8px 12px;
    background: #35354d;
    border-radius: 4px;
    font-size: 12px;
    margin-bottom: 12px;
    min-height: 20px;
  }
  .status.ok { color: #90ee90; }
  .status.warn { color: #ffb366; }
  .status.err { color: #ff8080; }

  /* 이미지 체크리스트 모달 */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #2a2a3e;
    border-radius: 8px;
    padding: 20px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .modal h2 {
    margin: 0 0 8px;
    color: #ffd700;
    font-size: 18px;
  }
  .modal p {
    margin: 0 0 12px;
    font-size: 13px;
    color: #aaa;
  }
  .img-list {
    flex: 1;
    overflow-y: auto;
    background: #1a1a2a;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 12px;
  }
  .img-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-bottom: 1px solid #35354d;
    font-size: 13px;
  }
  .img-item:last-child { border-bottom: none; }
  .img-item input[type=checkbox] {
    width: 18px;
    height: 18px;
    cursor: pointer;
  }
  .img-item label {
    flex: 1;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    color: #d0d0d0;
  }
  .img-item .hint {
    font-size: 11px;
    color: #888;
    margin-left: 8px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .select-all-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .select-all-bar button {
    padding: 4px 10px;
    font-size: 12px;
  }
</style>
</head>
<body>

<h1>🦆 Figma → Caveduck Migrator</h1>
<p class="subtitle">Anima export한 HTML/CSS 파일들을 케이브덕용 인라인 스타일로 변환합니다.</p>

<div class="toolbar">
  <button onclick="doConvert()">▶ 변환 시작</button>
  <button class="secondary" onclick="copyOutput()">📋 결과 복사</button>
  <button class="secondary" onclick="clearAll()">🗑 초기화</button>
  <button class="secondary" onclick="loadSample()">📝 샘플 로드</button>
</div>

<div class="status" id="status">대기 중...</div>

<div class="container">
  <div class="panel">
    <div class="panel-header">
      <span>📥 입력 (index.html + &lt;style&gt; 안에 CSS 합쳐 붙여넣기)</span>
    </div>
    <textarea id="input" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;head&gt;&#10;  &lt;style&gt;&#10;    /* globals.css + style.css 내용을 여기에 */&#10;  &lt;/style&gt;&#10;&lt;/head&gt;&#10;&lt;body&gt;&#10;  &lt;!-- index.html의 body 내용 --&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea>
  </div>
  <div class="panel">
    <div class="panel-header">
      <span>📤 출력 (케이브덕에 붙여넣을 코드)</span>
    </div>
    <textarea id="output" readonly placeholder="변환된 코드가 여기에 표시됩니다."></textarea>
  </div>
</div>

<!-- 이미지 체크리스트 모달 -->
<div class="modal-bg" id="imgModal">
  <div class="modal">
    <h2>🖼️ 이미지 경로 확인</h2>
    <p>로컬 이미지 경로가 발견되었습니다. <b>제거할 이미지에만 체크</b>하세요. (유령 이미지 = Anima가 자동 생성한 불필요한 배경)</p>
    <div class="select-all-bar">
      <button onclick="toggleAllImages(true)">모두 선택</button>
      <button onclick="toggleAllImages(false)">모두 해제</button>
      <button onclick="autoSuggest()">🤖 자동 추천</button>
    </div>
    <div class="img-list" id="imgList"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="cancelImageModal()">취소</button>
      <button onclick="applyImageChoice()">✓ 적용하고 변환</button>
    </div>
  </div>
</div>

<script>
/* ============================================
   Figma → Caveduck 변환기
   v2.0 - 체크박스 방식 이미지 선택
   ============================================ */

// 폰트 매핑 테이블
const CAVEDUCK_FONT_MAP = {
  'applesdgothicneoh00': '"Apple SD Gothic Neo"',
  'applesdgothicneo':    '"Apple SD Gothic Neo"',
  'pretendard':          '"Pretendard"',
  'notosanskr':          '"Noto Sans KR"',
  'notoserifkr':         '"Noto Serif KR"',
  'nanumgothiccoding':   '"Nanum Gothic Coding"',
  'georgia':             'Georgia',
  'timesnewroman':       '"Times New Roman"',
  'impact':              'Impact',
  'couriernew':          '"Courier New"',
};

const FONT_WEIGHT_MAP = {
  'thin':       '100',
  'extralight': '200',
  'ultralight': '200',
  'light':      '300',
  'regular':    '400',
  'normal':     '400',
  'medium':     '500',
  'semibold':   '600',
  'demibold':   '600',
  'bold':       '700',
  'extrabold':  '800',
  'ultrabold':  '800',
  'heavy':      '900',
  'black':      '900',
};

// 전역 상태 (모달용)
let pendingConvertState = null;

/* ============================================
   메인 변환 함수
   ============================================ */
function doConvert() {
  const input = document.getElementById('input').value.trim();
  if (!input) {
    setStatus('입력이 비어있습니다.', 'err');
    return;
  }

  try {
    // 1) HTML 파싱
    const parser = new DOMParser();
    const doc = parser.parseFromString(input, 'text/html');

    // 2) CSS 규칙 추출
    const cssRules = extractCSS(doc);
    if (Object.keys(cssRules).length === 0) {
      setStatus('⚠ <style> 태그에서 CSS를 찾을 수 없습니다.', 'warn');
    }

    // 3) 로컬 이미지 경로 스캔
    const imagePaths = scanLocalImages(doc, cssRules);
    
    if (imagePaths.length > 0) {
      // 모달 띄우기
      pendingConvertState = { doc, cssRules };
      showImageModal(imagePaths, doc, cssRules);
      return;
    }

    // 이미지 없으면 바로 진행
    finalizeConvert(doc, cssRules, new Set());
  } catch (e) {
    console.error(e);
    setStatus('❌ 오류: ' + e.message, 'err');
  }
}

/* ============================================
   CSS 규칙 파싱
   ============================================ */
function extractCSS(doc) {
  const rules = {};
  const styles = doc.querySelectorAll('style');
  let raw = '';
  styles.forEach(s => raw += '\n' + s.textContent);

  // 주석 제거
  raw = raw.replace(/\/\*[\s\S]*?\*\//g, '');

  // @font-face, @media 등 at-rule 제거 (단순화)
  raw = raw.replace(/@[a-z-]+[^{]*\{(?:[^{}]|\{[^}]*\})*\}/gi, '');

  // 셀렉터 { 속성 } 파싱
  const re = /([^{}]+)\{([^{}]+)\}/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    const selectors = m[1].split(',').map(s => s.trim());
    const body = m[2].trim();
    selectors.forEach(sel => {
      if (!rules[sel]) rules[sel] = '';
      rules[sel] += (rules[sel] ? ';' : '') + body.replace(/;\s*$/, '');
    });
  }
  return rules;
}

/* ============================================
   로컬 이미지 경로 스캔
   ============================================ */
function scanLocalImages(doc, cssRules) {
  const paths = new Map(); // path -> {selectors:[], contexts:[]}

  // CSS에서 url() 찾기
  Object.entries(cssRules).forEach(([sel, body]) => {
    const urlMatches = body.matchAll(/url\(['"]?([^'")]+)['"]?\)/g);
    for (const um of urlMatches) {
      const path = um[1];
      if (!isLocalPath(path)) continue;
      if (!paths.has(path)) paths.set(path, { selectors: [], contexts: [] });
      paths.get(path).selectors.push(sel);

      // 힌트 수집: 이 셀렉터에 background-color 또는 gradient가 있는지
      const hasColor = /background-color\s*:/.test(body) 
                    || /background\s*:\s*(?:#|rgb)/.test(body);
      const hasGradient = /linear-gradient|radial-gradient/.test(body);
      
      // 자식 노드 존재 확인
      const cleanSel = sel.replace(/^\./, '');
      const el = doc.querySelector(sel);
      const hasChildren = el && el.children.length > 0;
      const hasText = el && el.textContent.trim().length > 0;

      const ctx = [];
      if (hasColor) ctx.push('배경색 있음');
      if (hasGradient) ctx.push('그라데이션 있음');
      if (hasChildren) ctx.push(`자식 ${el.children.length}개`);
      if (hasText) ctx.push('텍스트 있음');
      paths.get(path).contexts = ctx;
    }
  });

  // <img> 태그 src도 스캔
  doc.querySelectorAll('img[src]').forEach(img => {
    const src = img.getAttribute('src');
    if (!isLocalPath(src)) return;
    if (!paths.has(src)) paths.set(src, { selectors: ['<img>'], contexts: ['img 태그'] });
  });

  return Array.from(paths.entries()).map(([path, info]) => ({
    path,
    selectors: info.selectors,
    contexts: info.contexts,
    isImgTag: info.selectors.includes('<img>')
  }));
}

function isLocalPath(url) {
  if (!url) return false;
  if (/^https?:\/\//i.test(url)) return false;
  if (/^data:/i.test(url)) return false;
  if (/^\/\//.test(url)) return false;
  return true;
}

/* ============================================
   이미지 체크리스트 모달
   ============================================ */
function showImageModal(imagePaths, doc, cssRules) {
  const listEl = document.getElementById('imgList');
  listEl.innerHTML = '';

  imagePaths.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'img-item';
    const hintText = item.contexts.length > 0 
      ? ` (${item.contexts.join(', ')})` 
      : '';
    const suggestion = shouldAutoRemove(item) ? ' 🤖제거추천' : '';
    div.innerHTML = `
      <input type="checkbox" id="img_${idx}" data-path="${escapeAttr(item.path)}" data-imgtag="${item.isImgTag}">
      <label for="img_${idx}">
        ${escapeHtml(item.path)}
        <span class="hint">${escapeHtml(item.selectors.join(', '))}${hintText}${suggestion}</span>
      </label>
    `;
    listEl.appendChild(div);
  });

  document.getElementById('imgModal').classList.add('show');
}

// 자동 제거 추천 판단
function shouldAutoRemove(item) {
  if (item.isImgTag) return false; // img 태그는 유지
  // 배경색, 그라데이션, 자식 요소가 있으면 유령 가능성
  const ctx = item.contexts.join(',');
  return /배경색|그라데이션|자식/.test(ctx);
}

function toggleAllImages(check) {
  document.querySelectorAll('#imgList input[type=checkbox]')
    .forEach(cb => cb.checked = check);
}

function autoSuggest() {
  document.querySelectorAll('#imgList .img-item').forEach(item => {
    const cb = item.querySelector('input[type=checkbox]');
    const label = item.querySelector('label').textContent;
    cb.checked = /제거추천/.test(label);
  });
}

function cancelImageModal() {
  document.getElementById('imgModal').classList.remove('show');
  pendingConvertState = null;
  setStatus('변환이 취소되었습니다.', 'warn');
}

function applyImageChoice() {
  const toRemove = new Set();
  document.querySelectorAll('#imgList input[type=checkbox]:checked')
    .forEach(cb => toRemove.add(cb.dataset.path));

  document.getElementById('imgModal').classList.remove('show');

  if (pendingConvertState) {
    const { doc, cssRules } = pendingConvertState;
    finalizeConvert(doc, cssRules, toRemove);
    pendingConvertState = null;
  }
}

/* ============================================
   변환 최종 실행
   ============================================ */
function finalizeConvert(doc, cssRules, imagesToRemove) {
  const body = doc.body;
  if (!body) {
    setStatus('❌ <body> 태그를 찾을 수 없습니다.', 'err');
    return;
  }

  const stats = {
    elements: 0,
    inlined: 0,
    imagesRemoved: 0,
    imagesKept: 0,
    overflowRemoved: 0,
    fontsFixed: 0,
    positionsAdded: 0,
  };

  // 재귀 처리
  processElement(body, cssRules, imagesToRemove, stats);

  // 후처리: box-shadow 있는 요소의 부모만 overflow 제거
  smartOverflowFix(body, stats);

  // 결과 HTML 생성
  const result = cleanupHTML(body.innerHTML);
  document.getElementById('output').value = result;

  setStatus(
    `✅ 완료 | 요소 ${stats.elements}개 | 인라인화 ${stats.inlined} | ` +
    `이미지 제거 ${stats.imagesRemoved}/유지 ${stats.imagesKept} | ` +
    `overflow 정리 ${stats.overflowRemoved} | position 보강 ${stats.positionsAdded}`,
    'ok'
  );
}

/* ============================================
   요소 재귀 처리 (핵심)
   ============================================ */
function processElement(el, cssRules, imagesToRemove, stats) {
  if (el.nodeType !== 1) return;
  stats.elements++;

  // 1) 클래스별 CSS 규칙 수집
  const classes = (el.getAttribute('class') || '').split(/\s+/).filter(Boolean);
  let combinedStyle = '';

  // 태그 선택자 (예: body, div)
  const tagSel = el.tagName.toLowerCase();
  if (cssRules[tagSel]) combinedStyle += cssRules[tagSel] + ';';

  classes.forEach(cls => {
    if (cssRules['.' + cls]) combinedStyle += cssRules['.' + cls] + ';';
  });

  // 기존 인라인 style
  const existing = el.getAttribute('style') || '';
  if (existing) combinedStyle += ';' + existing;

  if (combinedStyle) {
    // 2) 스타일 파싱 → 정규화 → 재조립
    let styles = parseStyle(combinedStyle);

    // 폰트 정규화
    styles = normalizeFonts(styles, stats);

    // 이미지 제거 처리
    styles = filterImages(styles, imagesToRemove, stats);

    // 자식 중 position:absolute가 있으면 부모에 relative 보장
    if (needsRelativePosition(el, cssRules)) {
      if (!styles['position'] || styles['position'] === 'static') {
        styles['position'] = 'relative';
        stats.positionsAdded++;
      }
    }

    // opacity: 1 제거 (불필요)
    if (styles['opacity'] === '1') delete styles['opacity'];

    // 스타일 재조립
    const finalStyle = stringifyStyle(styles);
    if (finalStyle) {
      el.setAttribute('style', finalStyle);
      stats.inlined++;
    } else {
      el.removeAttribute('style');
    }

    // class 속성은 유지 (디버깅용) — 필요하면 아래 주석 해제해서 제거
    // el.removeAttribute('class');
  }

  // <img> 태그 src 처리
  if (el.tagName === 'IMG') {
    const src = el.getAttribute('src');
    if (src && imagesToRemove.has(src)) {
      el.parentNode.removeChild(el);
      stats.imagesRemoved++;
      return;
    } else if (src && isLocalPath(src)) {
      stats.imagesKept++;
    }
  }

  // 자식 재귀 (배열 복사 - 삭제 대비)
  Array.from(el.children).forEach(child => {
    processElement(child, cssRules, imagesToRemove, stats);
  });
}

/* ============================================
   스타일 파싱/조립
   ============================================ */
function parseStyle(str) {
  const result = {};
  str.split(';').forEach(decl => {
    const idx = decl.indexOf(':');
    if (idx < 0) return;
    const prop = decl.slice(0, idx).trim().toLowerCase();
    const val = decl.slice(idx + 1).trim();
    if (prop && val) result[prop] = val;
  });
  return result;
}

function stringifyStyle(obj) {
  return Object.entries(obj)
    .map(([k, v]) => `${k}: ${v}`)
    .join('; ');
}

/* ============================================
   폰트 정규화
   ============================================ */
function normalizeFonts(styles, stats) {
  if (styles['font-family']) {
    const original = styles['font-family'];
    const normalized = original.split(',').map(f => {
      const key = f.trim().toLowerCase().replace(/['"]/g, '').replace(/\s+/g, '');
      return CAVEDUCK_FONT_MAP[key] || f.trim();
    }).join(', ');
    if (normalized !== original) {
      styles['font-family'] = normalized;
      stats.fontsFixed++;
    }
  }

  if (styles['font-weight']) {
    const key = styles['font-weight'].toLowerCase().replace(/\s+/g, '');
    if (FONT_WEIGHT_MAP[key]) {
      styles['font-weight'] = FONT_WEIGHT_MAP[key];
      stats.fontsFixed++;
    }
  }

  return styles;
}

/* ============================================
   이미지 필터링 (선택된 것 제거)
   ============================================ */
function filterImages(styles, imagesToRemove, stats) {
  const bgProps = ['background', 'background-image'];
  bgProps.forEach(prop => {
    if (!styles[prop]) return;
    const val = styles[prop];
    const urlMatch = val.match(/url\(['"]?([^'")]+)['"]?\)/);
    if (!urlMatch) return;
    const path = urlMatch[1];
    if (imagesToRemove.has(path)) {
      // url() 부분만 제거하고 나머지는 유지
      const newVal = val.replace(/\s*url\(['"]?[^'")]+['"]?\)\s*,?/g, '').trim().replace(/,\s*$/, '');
      if (newVal && newVal !== 'none') {
        styles[prop] = newVal;
      } else {
        delete styles[prop];
      }
      stats.imagesRemoved++;
    } else {
      stats.imagesKept++;
      // 유지되는 이미지 경로는 따옴표 제거 (가독성)
      styles[prop] = val.replace(/url\(['"]([^'"]+)['"]\)/, 'url($1)');
    }
  });
  return styles;
}

/* ============================================
   자식이 absolute면 부모에 relative 필요
   ============================================ */
function needsRelativePosition(el, cssRules) {
  for (const child of el.children) {
    const classes = (child.getAttribute('class') || '').split(/\s+/).filter(Boolean);
    let childStyle = '';
    classes.forEach(cls => {
      if (cssRules['.' + cls]) childStyle += cssRules['.' + cls] + ';';
    });
    childStyle += ';' + (child.getAttribute('style') || '');
    if (/position\s*:\s*absolute/i.test(childStyle)) return true;
  }
  return false;
}

/* ============================================
   Smart Overflow 처리
   ★ 핵심 개선: box-shadow 있는 요소의 "직계 부모"만 overflow 제거
   ★ inset shadow는 부모 overflow와 무관하므로 건드리지 않음
   ============================================ */
function smartOverflowFix(root, stats) {
  const shadowElements = [];
  
  // box-shadow가 있는 요소 수집 (inset 제외)
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
  let node;
  while ((node = walker.nextNode())) {
    const style = node.getAttribute('style') || '';
    const shadowMatch = style.match(/box-shadow\s*:\s*([^;]+)/i);
    if (shadowMatch) {
      const shadowVal = shadowMatch[1];
      // inset이 아닌 경우만
      if (!/inset/i.test(shadowVal)) {
        shadowElements.push(node);
      }
    }
  }

  // 각 shadow 요소의 직계 부모만 overflow: hidden 제거
  shadowElements.forEach(el => {
    let parent = el.parentElement;
    // 직계 부모 1개만 처리 (안전)
    if (parent && parent !== root.parentElement) {
      const pStyle = parseStyle(parent.getAttribute('style') || '');
      if (pStyle['overflow'] === 'hidden' || pStyle['overflow-x'] === 'hidden' || pStyle['overflow-y'] === 'hidden') {
        delete pStyle['overflow'];
        delete pStyle['overflow-x'];
        delete pStyle['overflow-y'];
        const newStyle = stringifyStyle(pStyle);
        if (newStyle) parent.setAttribute('style', newStyle);
        else parent.removeAttribute('style');
        stats.overflowRemoved++;
      }
    }
  });
}

/* ============================================
   HTML 정리
   ============================================ */
function cleanupHTML(html) {
  return html
    .replace(/&quot;/g, '"')
    .replace(/\s+class="[^"]*"/g, '') // class 제거 (선택사항 - 원치 않으면 이 줄 삭제)
    .replace(/\n\s*\n/g, '\n')
    .trim();
}

/* ============================================
   유틸
   ============================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;');
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + (type || '');
}

function copyOutput() {
  const out = document.getElementById('output');
  out.select();
  document.execCommand('copy');
  setStatus('📋 클립보드에 복사되었습니다.', 'ok');
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('output').value = '';
  setStatus('초기화 완료.', 'ok');
